name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify project
        run: ./gradlew test lint assembleDebug --no-daemon --max-workers=2

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          if-no-files-found: ignore
          path: |
            ~/.gradle/vallistruqui-brainrot-shield-build/app/reports
            ~/.gradle/vallistruqui-brainrot-shield-build/app/test-results
