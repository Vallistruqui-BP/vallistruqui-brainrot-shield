name: Bug report
description: Report incorrect blocking, a missed short-form feed, or another reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Brainrot Shield. Do not include usernames, screenshots of private content, accessibility dumps, tokens, or device identifiers. Report security-sensitive problems privately through the Security tab.
  - type: input
    id: app_version
    attributes:
      label: Brainrot Shield version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android and device
      description: Include Android version and device family, but no serial number or account information.
      placeholder: Android 15, Samsung Galaxy S23
    validations:
      required: true
  - type: input
    id: target_app
    attributes:
      label: Target app and version
      placeholder: YouTube 21.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, secrets, device identifiers, and private content from this report.
          required: true
